<div id="page">
  <div class="util">
    <div class="wrap">
      <p>Quality home appliances backed by over 100 years of trusted performance</p>
      <nav class="u-r" aria-label="Kenmore sites"><a href="https://www.kenmore.com/livemore" target="_blank" rel="noopener" data-ext>livemore&trade;</a><a href="https://www.kenmore.com/new-ventures" target="_blank" rel="noopener" data-ext>New Ventures</a><a href="https://www.kenmore.com/international" target="_blank" rel="noopener" data-ext>International</a></nav>
    </div>
  </div>
  <header class="hdr ld" id="hdr" style="--i:0">
    <div class="wrap hdr-in">
      <a class="logo" href="#/" aria-label="Kenmore home"><img id="logoImg" alt="Kenmore" width="116" height="21"></a>
      <nav class="nav" aria-label="Primary">
        <button type="button" id="megaBtn" aria-expanded="false" aria-controls="mega">Products <svg class="i" aria-hidden="true"><use href="#i-down"/></svg></button>
        <a href="#/?to=buy" data-to="buy" data-spy="buy">Where to Buy</a>
        <a href="#/?to=support" data-to="support" data-spy="support">Customer Care</a>
        <a href="https://www.kenmore.com/use-and-care-guide-search" target="_blank" rel="noopener" data-ext>Manuals <span class="sr-only">(opens kenmore.com in a new tab)</span></a>
      </nav>
      <div class="tools">
        <button type="button" class="s-trigger" data-search aria-label="Search products or model numbers"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><span>Product or model #</span><kbd>/</kbd></button>
        <button type="button" class="ibtn only-m" id="menuBtn" aria-label="Open menu" aria-haspopup="dialog"><svg class="i" aria-hidden="true"><use href="#i-menu"/></svg></button>
      </div>
    </div>
    <div class="mega" id="mega" role="region" aria-label="Products">
      <div class="wrap mega-in" id="megaIn"></div>
    </div>
  </header>

  <main id="main"><div id="app"></div></main>

  <footer class="foot" id="foot"></footer>
</div>

<div class="tray" id="tray" role="region" aria-label="Compare products" aria-live="polite"></div>

<dialog class="dlg-search" id="dlgSearch" aria-label="Search Kenmore">
  <div class="sp"><div class="wrap">
    <form class="sbar" role="search" id="sForm">
      <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
      <label class="sr-only" for="sIn">Search by product name or model number</label>
      <input id="sIn" type="search" placeholder="Search by product name or model number" autocomplete="off">
      <button type="button" class="x" data-close aria-label="Close search"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
    </form>
    <div class="sres" id="sRes" aria-live="polite"></div>
  </div></div>
</dialog>
<dialog class="dlg-cmp" id="dlgCmp" aria-labelledby="cmpTitle"><div class="cmp" id="cmpBody"></div></dialog>
<dialog class="dlg-drawer" id="dlgFilters" aria-labelledby="fdTitle">
  <div class="drawer">
    <div class="drawer-top"><h2 class="eyebrow" id="fdTitle">Filters</h2><button type="button" class="x" data-close aria-label="Close filters"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>
    <div class="drawer-body" id="fdBody"></div>
    <div class="drawer-foot"><button type="button" class="btn btn--ghost" id="fdClear">Clear all</button><button type="button" class="btn" data-close id="fdShow">Show results</button></div>
  </div>
</dialog>
<dialog class="dlg-menu" id="dlgMenu" aria-label="Menu"><div class="menu" id="menuBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../shared/data.js"></script>
<script src="../shared/core.js"></script>
<script src="app.js"></script>
</body>
</html>
